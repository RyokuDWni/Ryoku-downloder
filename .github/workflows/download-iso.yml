name: Download ISO to Release

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the file'
        required: true
        default: 'https://iso.ryoku.dev/stable/ryoku-2026.09.26-r217-cfd8899-x86_64-v0.75.3-beta.20.iso'
      tag:
        description: 'Release tag'
        required: true
        default: 'ryoku-2026.09.26'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 wget curl

      - name: Download file (multi-method fallback)
        run: |
          URL="${{ github.event.inputs.file_url }}"
          FILE=$(basename "$URL")
          echo "FILE=$FILE" >> $GITHUB_ENV
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          REF="$(echo "$URL" | awk -F/ '{print $1"//"$3"/"}')"

          echo "=== Try 1: wget with browser UA ==="
          if wget --user-agent="$UA" \
                  --referer="$REF" \
                  --header="Accept: */*" \
                  --header="Accept-Language: en-US,en;q=0.9" \
                  --tries=2 --timeout=30 --waitretry=3 \
                  -O "$FILE" "$URL"; then
            echo "SUCCESS via wget"
          else
            echo "wget failed, trying aria2..."
            rm -f "$FILE"

            echo "=== Try 2: aria2c with browser UA ==="
            if aria2c -x 8 -s 8 -k 1M \
                      --user-agent="$UA" \
                      --referer="$REF" \
                      --header="Accept: */*" \
                      --retry-wait=3 --max-tries=3 \
                      --allow-overwrite=true \
                      -o "$FILE" "$URL"; then
              echo "SUCCESS via aria2c"
            else
              echo "aria2c failed, trying curl..."
              rm -f "$FILE"

              echo "=== Try 3: curl with browser UA ==="
              curl -L --fail --retry 3 --retry-delay 5 \
                   -H "User-Agent: $UA" \
                   -H "Referer: $REF" \
                   -H "Accept: */*" \
                   -H "Accept-Language: en-US,en;q=0.9" \
                   -o "$FILE" "$URL" || {
                     echo "curl also failed. Trying via proxy..."
                     rm -f "$FILE"

                     echo "=== Try 4: via allorigins proxy ==="
                     curl -L --fail -o "$FILE" \
                       "https://api.allorigins.win/raw?url=$(printf %s "$URL" | jq -sRr @uri)" || {
                         echo "ALL METHODS FAILED"
                         exit 1
                       }
                   }
            fi
          fi

          ls -lh "$FILE"
          SIZE=$(stat -c%s "$FILE")
          echo "File size: $SIZE bytes"

          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: File is smaller than 100MB — likely an error page, not the ISO."
            head -c 500 "$FILE"
            exit 1
          fi

          if [ "$SIZE" -gt 2000000000 ]; then
            echo "File >2GB, splitting into 1900MB parts..."
            split -b 1900M -d -a 2 "$FILE" "${FILE}.part"
            rm -f "$FILE"
            echo "FILES=${FILE}.part*" >> $GITHUB_ENV
          else
            echo "FILES=$FILE" >> $GITHUB_ENV
          fi

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $FILES --clobber
          else
            gh release create "$TAG" $FILES \
              --title "$TAG" \
              --notes "Downloaded from ${{ github.event.inputs.file_url }}"
          fi
