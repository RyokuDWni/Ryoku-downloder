name: Download ISO and Package as RAR

on:
  workflow_dispatch:
    inputs:
      file_url:
        description: 'Direct URL of the file'
        required: true
        default: 'https://iso.ryoku.dev/stable/ryoku-2026.09.26-r217-cfd8899-x86_64-v0.75.3-beta.20.iso'
      tag:
        description: 'Release tag'
        required: true
        default: 'ryoku-2026.09.26'
      part_size:
        description: 'RAR volume size (m=MB, g=GB)'
        required: true
        default: '1900m'

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools (aria2, rar)
        run: |
          sudo apt-get update
          sudo apt-get install -y aria2 wget curl
          sudo add-apt-repository -y multiverse
          sudo apt-get update
          sudo apt-get install -y rar || {
            echo "apt rar failed, downloading binary from rarlab..."
            wget -q https://www.rarlab.com/rar/rarlinux-x64-624.tar.gz -O /tmp/rar.tgz
            tar -xzf /tmp/rar.tgz -C /tmp
            sudo cp /tmp/rar/rar /usr/local/bin/
            sudo cp /tmp/rar/unrar /usr/local/bin/
            sudo chmod +x /usr/local/bin/rar /usr/local/bin/unrar
          }
          echo "rar version:"
          rar 2>&1 | head -2 || true

      - name: Download file (16-connection segmented download)
        run: |
          URL="${{ github.event.inputs.file_url }}"
          FILE=$(basename "$URL")
          echo "FILE=$FILE" >> "$GITHUB_ENV"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36"
          REF="$(echo "$URL" | awk -F/ '{print $1"//"$3"/"}')"

          echo "=== Segmented download via aria2c (16 parallel connections) ==="
          if ! aria2c -x 16 -s 16 -k 1M \
                 --user-agent="$UA" \
                 --referer="$REF" \
                 --header="Accept: */*" \
                 --retry-wait=3 --max-tries=5 \
                 --allow-overwrite=true \
                 --file-allocation=none \
                 --summary-interval=30 \
                 --console-log-level=warn \
                 -o "$FILE" "$URL"; then
            echo "aria2c failed, falling back to wget..."
            rm -f "$FILE"
            wget --user-agent="$UA" --referer="$REF" -O "$FILE" "$URL" || {
              echo "Download failed"; exit 1
            }
          fi

          ls -lh "$FILE"
          SIZE=$(stat -c%s "$FILE")
          echo "Downloaded size: $SIZE bytes"
          if [ "$SIZE" -lt 100000000 ]; then
            echo "ERROR: File too small, likely an error page."
            exit 1
          fi

      - name: Create split RAR archive (store mode)
        run: |
          PART_SIZE="${{ github.event.inputs.part_size }}"
          echo "Creating RAR volumes of size $PART_SIZE ..."
          rar a -v"$PART_SIZE" -m0 -idq "${FILE}.rar" "$FILE"

          echo "=== RAR parts created ==="
          ls -lh "${FILE}"*.rar "${FILE}".r[0-9][0-9] 2>/dev/null || true

          RAR_PARTS=$(find . -maxdepth 1 -type f \( -name "${FILE}*.rar" -o -name "${FILE}.r[0-9][0-9]" \) -printf '%f\n' | sort | tr '\n' ' ' | sed 's/ $//')
          if [ -z "$RAR_PARTS" ]; then
            echo "ERROR: No RAR parts found!"
            exit 1
          fi
          echo "RAR parts to upload:"
          echo "$RAR_PARTS"
          echo "RAR_PARTS=$RAR_PARTS" >> "$GITHUB_ENV"

          echo "Removing original ISO to free disk space..."
          rm -f "$FILE"

      - name: Upload RAR parts to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" $RAR_PARTS --clobber
          else
            gh release create "$TAG" $RAR_PARTS \
              --title "$TAG" \
              --notes "Downloaded from ${{ github.event.inputs.file_url }} — split into RAR parts. Use WinRAR/7-Zip to extract part1."
          fi
